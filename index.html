<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zane Ely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --white:     #f7f8fc;
      --blue-100:  #d6dffa;
      --blue-200:  #a8baf5;
      --blue-400:  #4a72e8;
      --blue-500:  #2f57d4;
      --slate-200: #c9d0e8;
      --slate-400: #7b87ab;
      --slate-600: #3d4a6b;
      --black:     #0d1120;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--white);
      color: var(--slate-600);
      font-family: 'Lora', serif;
      font-weight: 400;
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(247,248,252,0.93);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--blue-100);
    }
    .nav-inner {
      display: flex;
      justify-content: center;
      padding: 0 4rem;
    }
    .nav-links {
      display: flex;
      gap: 3.2rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--slate-400);
      padding: 1.6rem 0 1.4rem;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      display: block;
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--blue-400); border-bottom-color: var(--blue-400); }

    /* HERO */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 7rem 4rem 5rem;
      position: relative;
      overflow: hidden;
    }

    @keyframes blobWarp {
      0%   { border-radius: 50%; }
      20%  { border-radius: 58% 42% 54% 46% / 48% 56% 44% 52%; }
      40%  { border-radius: 44% 56% 48% 52% / 56% 42% 58% 44%; }
      60%  { border-radius: 52% 48% 62% 38% / 44% 52% 48% 56%; }
      80%  { border-radius: 46% 54% 42% 58% / 58% 46% 54% 42%; }
      100% { border-radius: 50%; }
    }

    /* Continuous upward float — blobs start below overflow:hidden boundary,
       rise through the hero, exit at top, loop back seamlessly */
    @keyframes blobFloat {
      0%   { transform: translateY(0)      translateX(0);    }
      25%  { transform: translateY(-50vh)  translateX(24px); }
      50%  { transform: translateY(-100vh) translateX(-18px);}
      75%  { transform: translateY(-150vh) translateX(16px); }
      100% { transform: translateY(-200vh) translateX(0);    }
    }

    .hero-bg-blob {
      position: absolute;
      bottom: -700px; right: -150px;
      width: 680px; height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #bfcdf8 0%, #dce6fc 40%, transparent 72%);
      opacity: 0.45;
      pointer-events: none;
      animation:
        blobWarp 11s ease-in-out 0s infinite,
        blobFloat 38s ease-in-out -16s infinite;
    }
    .hero-blob-bl {
      position: absolute;
      bottom: -450px; left: -120px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 55%, #bfcdf8 0%, #dce6fc 45%, transparent 70%);
      opacity: 0.28;
      pointer-events: none;
      animation:
        blobWarp 15s ease-in-out 0s infinite reverse,
        blobFloat 50s ease-in-out -20s infinite;
    }
    .hero-blob-mid {
      position: absolute;
      bottom: -280px; right: 100px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 45%, #a8baf5 0%, #dce6fc 50%, transparent 72%);
      opacity: 0.22;
      pointer-events: none;
      animation:
        blobWarp 13s ease-in-out 4s infinite,
        blobFloat 30s ease-in-out -12s infinite;
    }

    .hero-bg-line {
      position: absolute;
      bottom: 90px; left: 0;
      width: 100%; height: 1px;
      background: linear-gradient(to right, transparent, var(--blue-100) 30%, var(--blue-100) 70%, transparent);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .hero-eyebrow {
      font-size: 0.73rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--blue-400);
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    .hero-name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(5rem, 14vw, 13rem);
      line-height: 0.92;
      color: var(--black);
      white-space: nowrap;
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.22s forwards;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: var(--slate-600);
      max-width: 460px;
      margin-bottom: 2.6rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.38s forwards;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      opacity: 0;
      animation: fadeUp 0.7s 0.52s forwards;
    }

    .btn-primary {
      background: var(--blue-500);
      color: #fff;
      padding: 0.8rem 2rem;
      border-radius: 2px;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-primary:hover { background: var(--blue-400); transform: translateY(-2px); }

    .btn-ghost {
      background: transparent;
      color: var(--blue-500);
      padding: 0.8rem 2rem;
      border-radius: 2px;
      border: 1px solid var(--blue-500);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .btn-ghost:hover { background: var(--blue-500); color: #fff; transform: translateY(-2px); }

    @keyframes scrollPulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

    /* FOOTER */
    footer {
      background: var(--black);
      padding: 3.5rem 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      position: relative;
      overflow: hidden;
    }
    footer::before {
      content: '';
      position: absolute;
      top: -150px; right: -150px;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(47,87,212,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .footer-left {
      position: relative; z-index: 1;
    }
    .footer-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--white);
      margin-bottom: 0.3rem;
    }
    .footer-tagline {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue-200);
    }
    .footer-right {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.55rem;
    }
    .footer-link {
      text-decoration: none;
      font-size: 0.88rem;
      color: var(--slate-400);
      transition: color 0.2s;
      letter-spacing: 0.02em;
    }
    .footer-link:hover { color: var(--blue-200); }
    .footer-bottom {
      background: var(--black);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 1rem 4rem;
      display: flex;
      justify-content: space-between;
    }
    .footer-bottom span {
      font-size: 0.72rem;
      color: var(--slate-600);
      letter-spacing: 0.05em;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 900px) {
      .nav-inner { padding: 0 2rem; }
      #hero { padding: 6rem 2rem 5rem; }
      .hero-name { font-size: clamp(3.5rem, 16vw, 6rem); white-space: normal; }
      footer { flex-direction: column; align-items: flex-start; padding: 3rem 2rem; }
      .footer-right { align-items: flex-start; }
      .footer-bottom { padding: 1rem 2rem; flex-direction: column; gap: 0.3rem; }
    }
  </style>
</head>

<footer>

  </div>
</footer>
<div class="footer-bottom">
  <span>© 2026 Zane Ely</span>
</div>

</body>
</html>
